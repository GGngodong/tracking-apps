name: tracking_apps
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bloc: ^8.1.4
  equatable: ^2.0.0
  logger: ^2.4.0
  connectivity_plus: ^6.1.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.14
  font_awesome_flutter: ^10.8.0
  shared_preferences: ^2.3.3
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.2.0+3
  dropdown_button2: ^2.3.9
  file_picker: ^8.1.4
  syncfusion_flutter_pdfviewer: ^27.2.4
  firebase_core: ^3.8.1
  firebase_storage: ^12.3.7
  firebase_database: ^11.2.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  dartz: ^0.10.1
  dio: ^5.7.0
  get_it: ^8.0.3
  flutter_bloc: ^8.1.6
  http: ^1.2.2
  dotenv: ^4.2.0
  easy_localization: ^3.0.7
  uuid: ^4.5.1
  gal: ^2.3.1
  go_router: ^14.6.3
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  flutter_dotenv: ^5.2.1
  cloud_functions: ^5.3.0
  http_parser: ^4.0.2
  mime: ^2.0.0
  intl: ^0.19.0
  skeleton_text: ^3.0.1
  flutter_localization: ^0.3.1
 

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true

  assets: 
    - assets/home/
    - assets/icons/
    - assets/fonts/
    - assets/translation/
    - .env

  fonts:
    - family: Satoshi
      fonts:
      - asset: assets/fonts/Satoshi-Black.otf
      - asset: assets/fonts/Satoshi-BlackItalic.otf
      - asset: assets/fonts/Satoshi-Bold.otf
      - asset: assets/fonts/Satoshi-BoldItalic.otf
      - asset: assets/fonts/Satoshi-Italic.otf
      - asset: assets/fonts/Satoshi-Light.otf
      - asset: assets/fonts/Satoshi-LightItalic.otf
      - asset: assets/fonts/Satoshi-Medium.otf
      - asset: assets/fonts/Satoshi-MediumItalic.otf
      - asset: assets/fonts/Satoshi-Regular.otf

